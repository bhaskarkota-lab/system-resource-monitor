<section class="panel">
<h2>? Process Manager</h2>
<div class="controls">
<input id="search" placeholder="Search process..." />
<select id="sort">
<option value="memory">Sort: Memory</option>
<option value="cpu">Sort: CPU</option>
<option value="name">Sort: Name</option>
</select>
<button onclick="loadProcesses()">Refresh</button>
</div>
<table>
<thead><tr><th>Process</th><th>PID</th><th>CPU %</th><th>Memory</th><th>Action</th></tr></thead>
<tbody id="processes"></tbody>
</table>
</section>
